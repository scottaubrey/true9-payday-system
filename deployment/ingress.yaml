apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: true9-payday-web

spec:
  class: cloudflare-tunnel
  rules:
    - host: payday.${service_domain}
      http:
        paths:
          - pathType: Prefix
            path: /
            backend:
              service:
                name: true9-payday-web
                port:
                  number: 3000
