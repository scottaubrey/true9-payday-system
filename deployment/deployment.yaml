apiVersion: apps/v1
kind: Deployment
metadata:
  name: true9-payday-web
spec:
  replicas: 2
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: oci.oraclecloud.com/fault-domain
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              kubernetes.io/component: web
              kubernetes.io/name: true9-payday
          matchLabelKeys:
            - pod-template-hash
      containers:
        - name: web
          image: ghcr.io/scottaubrey/true9-payday-system:20261018085812.0.0-g2ee3d07-39113481544-1 # {"$imagepolicy": "true9:true9-payday-system"}
          ports:
            - containerPort: 8888
              protocol: TCP
              name: http
