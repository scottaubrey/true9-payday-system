[tools]
mago = "1.56.3"
bun = "1.4.3"
biome = "2.5.15"
"http:php" = { version = "8.5.8", url = 'https://dl.static-php.dev/static-php-cli/bulk/php-{{ version }}-cli-{{ os() }}-{{ arch(x64="x86_64",arm64="aarch64") }}.tar.gz' }
"github:composer/composer" = "2.10.3"

[tasks.install-deps-backend]
run = "composer install"

[tasks.format-backend]
run = "mago format"
depends = ["install-deps-backend"]
[tasks.lint-backend]
run = "mago lint"
depends = ["install-deps-backend"]
[tasks.analyse-backend]
run = "mago analyze"
depends = ["install-deps-backend"]

[tasks.test-backend]
run = "php vendor/bin/pest"
depends = ["install-deps-backend"]

[tasks.check-backend]
depends = ["format-backend", "lint-backend", "analyse-backend", "test-backend"]

[tasks.start-backend]
run = "php -S localhost:8888 -t public/ app.php"
depends = ["install-deps-backend"]

[tasks.install-deps-frontend]
run = "bun install"

[tasks.format-frontend]
run = "biome format"
depends = ["install-deps-frontend"]
[tasks.lint-frontend]
run = "biome lint"
depends = ["install-deps-frontend"]
[tasks.type-check-frontend]
run = ["bun check frontend/"]
depends = ["install-deps-frontend"]
[tasks.analyse-frontend]
run = ["biome check"]
depends = ["install-deps-frontend"]

[tasks.test-frontend]
run = "bun test --check frontend/"
depends = ["install-deps-frontend"]

[tasks.check-frontend]
depends = ["format-frontend", "lint-frontend", "type-check-frontend", "analyse-frontend", "test-frontend"]

[tasks.start-frontend]
run = "bun run --check frontend/server.ts"
depends = ["install-deps-frontend"]

[tasks.build-frontend]
run = "bun build frontend/index.html --outdir=public/"


[tasks.install-e2e]
run = [
    "bun run playwright install-deps",
    "bun run playwright install"
]
depends = ["install-deps-frontend"]

[tasks.test-e2e]
run = "bun run playwright test"
depends = ["install-e2e", "install-deps-backend"]

[tasks.check-e2e]
depends = ["format-frontend", "lint-frontend", "type-check-frontend", "analyse-frontend", "test-e2e"]
