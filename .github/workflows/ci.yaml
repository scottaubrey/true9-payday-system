name: CI Pipeline

on:
  push:
    paths-ignore:
      - "deployment/**"
      - "docs/**"
    branches:
      - main

env:
  IMAGE_REPO: ghcr.io/scottaubrey/true9-payday-system
  APT_DEPS: build-essential autoconf bison re2c pkg-config libxml2-dev libonig-dev libicu-dev libssl-dev libsqlite3-dev libcurl4-openssl-dev libpng-dev libreadline-dev

jobs:
  generate-version:
    runs-on: ubuntu-26.04
    outputs:
      trunkver: ${{ steps.trunkver.outputs.trunkver }}
    steps:
      - name: Get a version tag
        id: trunkver
        uses: crftd-tech/trunkver@main
  check-backend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get -y install ${{ env.APT_DEPS }}
      - uses: jdx/mise-action@v4
      - run: "mise format-backend ::: lint-backend ::: analyse-backend"
  check-frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get -y install ${{ env.APT_DEPS }}
      - uses: jdx/mise-action@v4
      - run: "mise format-frontend ::: lint-frontend ::: type-check-frontend ::: analyse-frontend"
  test-backend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get -y install ${{ env.APT_DEPS }}
      - uses: jdx/mise-action@v4
      - run: mise test-backend
  test-frontend:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get -y install ${{ env.APT_DEPS }}
      - uses: jdx/mise-action@v4
      - run: mise test-frontend
  test-e2e:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get -y install ${{ env.APT_DEPS }}
      - uses: jdx/mise-action@v4
      - run: mise test-e2e
  build-and-push:
    needs:
      [
        generate-version,
        check-frontend,
        check-backend,
        test-backend,
        test-frontend,
        test-e2e,
      ]
    runs-on: ubuntu-26.04
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push client image
        uses: docker/build-push-action@v7
        id: build-push
        with:
          push: true
          load: false
          platforms: linux/amd64,linux/arm64
          target: production
          tags: |
            ${{ env.IMAGE_REPO }}:latest
            ${{ env.IMAGE_REPO }}:${{ github.sha }}
            ${{ env.IMAGE_REPO }}:${{ needs.generate-version.outputs.trunkver }}
